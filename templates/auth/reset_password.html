{% extends "shared/base_auth.html" %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card fade-in">
        <div class="text-center mb-4">
            <i class="fas fa-key fa-3x"></i>
            <h2 class="fw-bold mt-3">Set New Password</h2>
            <p class="text-muted">Enter your new password below.</p>
        </div>
        
        <form method="POST" class="needs-validation" id="resetPasswordForm" novalidate>
            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="password" name="password" placeholder="New Password" minlength="6" required autofocus>
                <label for="password">New Password</label>
                <div class="invalid-feedback">Password must be at least 6 characters.</div>
            </div>

            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Confirm New Password" required>
                <label for="confirm_password">Confirm New Password</label>
                <div class="invalid-feedback" id="password-match-error">Passwords do not match.</div>
            </div>

            <div class="d-grid mt-4">
                <button class="btn btn-primary btn-lg" type="submit"><i class="fas fa-save me-2"></i>Reset Password</button>
            </div>
        </form>

        <div class="text-center mt-4">
            <small class="text-muted">Go back to <a href="{{ url_for('auth.login') }}">Login</a></small>
        </div>
    </div>
</div>
{% endblock %}

{% block body_extra %}
<script>
(function () {
    'use strict'
    const form = document.getElementById('resetPasswordForm');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirm_password');
    const passwordMatchError = document.getElementById('password-match-error');

    function checkPasswordMatch() {
        if (passwordInput.value !== confirmPasswordInput.value) {
            confirmPasswordInput.setCustomValidity("Passwords do not match.");
            passwordMatchError.style.display = 'block';
            confirmPasswordInput.classList.add('is-invalid');
        } else {
            confirmPasswordInput.setCustomValidity("");
            passwordMatchError.style.display = 'none';
            confirmPasswordInput.classList.remove('is-invalid');
        }
    }

    passwordInput.addEventListener('input', checkPasswordMatch);
    confirmPasswordInput.addEventListener('input', checkPasswordMatch);

    form.addEventListener('submit', function (event) {
        checkPasswordMatch();
        if (!form.checkValidity() || confirmPasswordInput.classList.contains('is-invalid')) {
            event.preventDefault();
            event.stopPropagation();
        }
        form.classList.add('was-validated');
    }, false);
})();
</script>
{% endblock %}
