{% extends "shared/base_auth.html" %}
{% block title %}Forgot Username — Attendly{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="text-center mb-4">
        <div style="width: 64px; height: 64px; border-radius: 50%; background: rgba(var(--primary-rgb), 0.1); color: var(--primary-color); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 1.5rem;">
            <i class="fas fa-id-card"></i>
        </div>
        <h2>Forgot Username?</h2>
        <p class="text-muted">Enter your email and we'll send it to you.</p>
    </div>
    
    <form method="POST" class="needs-validation" novalidate>
        <div class="form-floating mb-4">
            <input type="email" class="form-control" id="email" name="email" placeholder="Email Address" required autofocus autocomplete="email">
            <label for="email">Email Address</label>
            <div class="invalid-feedback">Please enter a valid email address.</div>
        </div>

        <div class="d-grid mb-3">
            <button class="btn-base btn-primary btn-lg" type="submit">
                <i class="fas fa-paper-plane me-2"></i> Send Username
            </button>
        </div>
    </form>

    <div class="text-center mt-4">
        <small class="text-muted"><a href="{{ url_for('auth.login') }}">Back to Login</a></small>
    </div>
</div>
{% endblock %}

{% block body_extra %}
<script>
(function () {
    'use strict'
    var forms = document.querySelectorAll('.needs-validation')
    Array.prototype.slice.call(forms)
        .forEach(function (form) {
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
        })
})()
</script>
{% endblock %}
