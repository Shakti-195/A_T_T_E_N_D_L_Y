{% extends "shared/base_auth.html" %}
{% block title %}Verify OTP{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="text-center mb-4">
            <i class="fas fa-shield-alt fa-3x text-primary"></i>
            <h2 class="fw-bold mt-3">Enter Verification Code</h2>
            <p class="text-muted">An OTP has been sent to <strong>{{ email }}</strong>.</p>
        </div>
        <form method="POST">
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="otp" name="otp" placeholder="6-Digit OTP" required maxlength="6" autofocus>
                <label for="otp">6-Digit OTP</label>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">Verify Account</button>
            </div>
        </form>

        <div class="auth-links mt-4">
            <a href="{{ url_for('auth.resend_verification_otp', email=email) }}">Didn't receive the code? Resend</a>
        </div>

        <div class="text-center mt-3">
            <small class="text-muted">
                Go back to <a href="{{ url_for('auth.login') }}">Login</a>
            </small>
        </div>
    </div>
</div>
{% endblock %}
