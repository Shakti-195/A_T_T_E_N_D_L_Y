{% extends "shared/base_auth.html" %}
{% block title %}Verify Email — Attendly{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="text-center mb-4">
        <div style="width: 64px; height: 64px; border-radius: 50%; background: rgba(var(--primary-rgb), 0.1); color: var(--primary-color); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 1.5rem;">
            <i class="fas fa-shield-alt"></i>
        </div>
        <h2>Verify Your Email</h2>
        <p class="text-muted">Enter the 6-digit code sent to<br><strong>{{ email }}</strong></p>
    </div>
    
    <form method="POST" class="needs-validation" novalidate>
        <!-- The view expects 'email' in the form data or we can pass it via hidden input if not in URL -->
        <input type="hidden" name="email" value="{{ email }}">
        
        <div class="form-floating mb-4">
            <input type="text" class="form-control text-center" id="otp" name="otp" placeholder="123456" required autofocus maxlength="6" pattern="\d{6}" style="font-size: 1.5rem; letter-spacing: 0.5rem; font-weight: 700;">
            <label for="otp">6-Digit Code</label>
            <div class="invalid-feedback text-center">Please enter the 6-digit code.</div>
        </div>

        <div class="d-grid mb-3">
            <button class="btn-base btn-primary btn-lg" type="submit">
                Verify Email
            </button>
        </div>
    </form>

    <div class="text-center mt-4">
        <small class="text-muted">Didn't receive the code? <a href="{{ url_for('auth.resend_verification_otp') }}?email={{ email }}">Resend Code</a></small>
    </div>
</div>
{% endblock %}

{% block body_extra %}
<script>
(function () {
    'use strict'
    var forms = document.querySelectorAll('.needs-validation')
    Array.prototype.slice.call(forms)
        .forEach(function (form) {
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
            
            // Allow only numbers
            const otpInput = document.getElementById('otp');
            if (otpInput) {
                otpInput.addEventListener('input', function(e) {
                    this.value = this.value.replace(/[^0-9]/g, '');
                });
            }
        })
})()
</script>
{% endblock %}
