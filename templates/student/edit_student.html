{% extends "shared/base.html" %}
{% block title %}Edit Student{% endblock %}

{% block page_title %}Edit Student{% endblock %}

{% block content %}
<div class="container mt-5 fade-in">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <div class="d-flex align-items-center mb-4">
                        <a href="{{ url_for('student.list_students') }}" class="btn btn-light me-3" title="Back to Students">
                            <i class="fas fa-arrow-left"></i>
                        </a>
                        <h2 class="card-title fw-bold mb-0">
                            <i class="fas fa-user-edit me-2 text-primary"></i>Edit Student
                        </h2>
                    </div>

                    <form method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ student.name }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="student_id" class="form-label">Student ID <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="student_id" name="student_id" value="{{ student.student_id }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address (Optional)</label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ student.email or '' }}">
                        </div>

                        <div class="mb-3">
                            <label for="class_batch_id" class="form-label">Assign to Batch <span class="text-danger">*</span></label>
                            <select class="form-select" id="class_batch_id" name="class_batch_id" required>
                                <option value="">Select a group...</option>
                                {% for class_batch in classes_batches %}
                                    <option value="{{ class_batch.id }}" {% if student.class_batch_id == class_batch.id %}selected{% endif %}>
                                        {{ class_batch.name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                            <a href="{{ url_for('student.list_students') }}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i> Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
