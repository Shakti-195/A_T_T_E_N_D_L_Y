<div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header bg-danger text-white">
            <h5 class="modal-title">Permanently Delete Account</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <p>This is a permanent action and cannot be undone. Are you absolutely sure you want to delete your account?</p>
            <p>To confirm, please type your email address (<strong>{{ g.user.email }}</strong>) in the box below.</p>
            <form id="deleteAccountForm" method="POST" action="{{ url_for('profile.delete_account') }}">
                <div class="mb-3">
                    <input type="email" class="form-control" id="email_confirm" name="email_confirm" required>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" form="deleteAccountForm" class="btn btn-danger" id="confirmDeleteBtn">I understand, delete my account</button>
        </div>
    </div>
</div>
