{% extends "shared/base_auth.html" %}
{% block title %}Forgot Username{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card fade-in">
        <div class="text-center mb-4">
            <i class="fas fa-user fa-3x"></i>
            <h2 class="fw-bold mt-3">Forgot Your Username?</h2>
            <p class="text-muted">Enter your email to receive your username.</p>
        </div>
        
        <form method="POST" class="needs-validation" novalidate>
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" name="email" placeholder="Email Address" required autofocus>
                <label for="email">Email Address</label>
                <div class="invalid-feedback">Please enter a valid email address.</div>
            </div>

            <div class="d-grid mt-4">
                <button class="btn btn-primary btn-lg" type="submit"><i class="fas fa-paper-plane me-2"></i>Send Username</button>
            </div>
        </form>

        <div class="text-center mt-4">
            <small class="text-muted">Remembered your username? <a href="{{ url_for('auth.login') }}">Login here</a></small>
        </div>
        
        <div class="text-center mt-3">
        </div>
    </div>
</div>
{% endblock %}
