<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Security Settings</title>
    
</head>
<body>
    <div class="section-card">
    <h3 class="section-title">Security & Authentication</h3>
    
    <div class="info-grid mb-4">
        <div class="info-card">
            <p class="info-card-label"><i class="fa-solid fa-key"></i> Password</p>
            <p class="info-card-value mb-3">••••••••</p>
            <a href="#" class="btn btn-sm btn-outline-primary">Change Password</a>
        </div>
        
        <div class="info-card">
            <p class="info-card-label">2FA Status</p>
            {% if user.two_factor_enabled %}
                <p class="info-card-value text-success mb-2">Enabled</p>
            {% else %}
                <p class="info-card-value text-warning mb-2">Disabled</p>
                <p class="text-muted" style="font-size: 0.8125rem; margin-bottom: 0.5rem;">Add an extra layer of security to your account.</p>
                <button class="btn btn-sm btn-primary">Enable 2FA</button>
            {% endif %}
        </div>
    </div>
</div>
